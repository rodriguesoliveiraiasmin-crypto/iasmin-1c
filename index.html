<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Jogo da Cobrinha</title>
  <style>
    body {
      background-color: #1a1a24;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    h1 { margin-bottom: 10px; }
    canvas {
      border: 3px solid #4e4e6a;
      background-color: #0d0d13;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
    .score { font-size: 1.2rem; margin-bottom: 15px; }
  </style>
</head>
<body>
  <h1>Jogo da Cobrinha</h1>
  <div class="score">Pontuação: <span id="score">0</span></div>
  <canvas id="gameCanvas" width="400" height="400"></canvas>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("score");

    const gridSize = 20;
    const tileCount = canvas.width / gridSize;

    let snake = [{ x: 10, y: 10 }];
    let dx = 0;
    let dy = 0;
    let foodX = 5;
    let foodY = 5;
    let score = 0;

    function drawTile(x, y, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x * gridSize, y * gridSize, gridSize - 2, gridSize - 2);
    }

    function generateFood() {
      foodX = Math.floor(Math.random() * tileCount);
      foodY = Math.floor(Math.random() * tileCount);
    }

    function update() {
      if (dx === 0 && dy === 0) return;

      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        resetGame();
        return;
      }

      for (let segment of snake) {
        if (head.x === segment.x && head.y === segment.y) {
          resetGame();
          return;
        }
      }

      snake.unshift(head);

      if (head.x === foodX && head.y === foodY) {
        score += 10;
        scoreElement.textContent = score;
        generateFood();
      } else {
        snake.pop();
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      snake.forEach((part, index) => {
        drawTile(part.x, part.y, index === 0 ? "#4CAF50" : "#81C784");
      });

      drawTile(foodX, foodY, "#FF5252");
    }

    function resetGame() {
      alert("Game Over! Sua pontuação final foi: " + score);
      snake = [{ x: 10, y: 10 }];
      dx = 0;
      dy = 0;
      score = 0;
      scoreElement.textContent = score;
      generateFood();
    }

    function main() {
      update();
      draw();
    }

    document.addEventListener("keydown", (e) => {
      switch (e.key) {
        case "ArrowUp":
          if (dy !== 1) { dx = 0; dy = -1; }
          break;
        case "ArrowDown":
          if (dy !== -1) { dx = 0; dy = 1; }
          break;
        case "ArrowLeft":
          if (dx !== 1) { dx = -1; dy = 0; }
          break;
        case "ArrowRight":
          if (dx !== -1) { dx = 1; dy = 0; }
          break;
      }
    });

    generateFood();
    setInterval(main, 100);
  </script>
</body>
</html>
